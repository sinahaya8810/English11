<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1026">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>挑め！大学受験英語 — 文法・単語・熟語</title>
<style>
:root{
  --text:#eef2ff; --sub:#aab4d6;
  --glass:rgba(255,255,255,.075); --glass2:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.16);
  --accent:#7dd3fc; --accent2:#a78bfa; --gold:#f5cf73;
  --ok:#34d399; --ng:#fb7185; --warn:#fbbf24;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1026}
body{
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",system-ui,sans-serif;
  color:var(--text);touch-action:manipulation;-webkit-user-select:none;user-select:none;
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

/* ===== 背景 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(110% 70% at 15% 0%,#26387f 0%,transparent 60%),
    radial-gradient(90% 70% at 100% 100%,#45196a 0%,transparent 60%),
    linear-gradient(165deg,#0a0f27 0%,#171c4a 48%,#25124a 100%);}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.45;will-change:transform}
.blob.b1{width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:#3b82f6;animation:drift1 22s ease-in-out infinite}
.blob.b2{width:50vmax;height:50vmax;right:-18vmax;top:20vh;background:#8b5cf6;animation:drift2 26s ease-in-out infinite}
.blob.b3{width:45vmax;height:45vmax;left:20vw;bottom:-25vmax;background:#06b6d4;opacity:.28;animation:drift3 30s ease-in-out infinite}
@keyframes drift1{50%{transform:translate3d(12vw,8vh,0) scale(1.1)}}
@keyframes drift2{50%{transform:translate3d(-10vw,-6vh,0) scale(.9)}}
@keyframes drift3{50%{transform:translate3d(-8vw,-10vh,0) scale(1.15)}}
#snow{position:fixed;inset:0;z-index:1;pointer-events:none}

/* ===== レイアウト ===== */
#app{position:relative;z-index:2;height:100vh;height:100dvh;max-width:1180px;margin:0 auto;
  display:flex;flex-direction:column;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 14px);}
.topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.04em;font-size:15px}
.brand .logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  background:linear-gradient(135deg,#60a5fa,#a78bfa);box-shadow:0 4px 14px rgba(96,165,250,.45)}
.pill{padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);
  font-size:14px;font-weight:700;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.stage{position:relative;display:flex;flex-shrink:0;max-height:32dvh}
@media (min-width:768px){.bubble-text{font-size:16px}.bubble{padding:16px 22px 16px 24px}}

.glass{background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
  border:1px solid var(--stroke);border-radius:var(--r);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 20px 50px rgba(3,6,30,.45),inset 0 1px 0 rgba(255,255,255,.18)}

/* ナレーション */
.bubble{position:relative;flex:1;min-width:0;max-height:100%;min-height:92px;padding:14px 18px 14px 20px;cursor:pointer;
  display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:1px solid var(--stroke);
  backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 16px 40px rgba(3,6,30,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.bubble::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#7dd3fc,#a78bfa,#f5cf73)}
.bubble.pop{animation:bubblePop .4s cubic-bezier(.2,.9,.3,1)}
@keyframes bubblePop{0%{transform:translateY(6px);opacity:.3}100%{transform:none;opacity:1}}
.bubble.tone-ok::before{background:linear-gradient(180deg,#34d399,#6ee7b7)}
.bubble.tone-ng::before{background:linear-gradient(180deg,#fb7185,#fbbf24)}
.bubble.tone-hint::before{background:linear-gradient(180deg,#fbbf24,#fde68a)}
.bubble-title{position:relative;font-weight:800;font-size:15px;margin-bottom:4px;color:#c4b5fd}
.bubble.tone-ok .bubble-title{color:#6ee7b7}.bubble.tone-ng .bubble-title{color:#fda4af}.bubble.tone-hint .bubble-title{color:#fde68a}
.bubble-title:empty{display:none}
.bubble-text{position:relative;font-size:14.5px;line-height:1.75;white-space:pre-wrap;overflow-y:auto;color:#e6eaff;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-right:2px}
.caret{display:inline-block;width:6px;height:1em;vertical-align:-2px;margin-left:2px;background:#a5b4fc;border-radius:2px;animation:caret .8s steps(2) infinite}
@keyframes caret{50%{opacity:0}}

.panel{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:18px}
.view{animation:viewIn .45s cubic-bezier(.2,.9,.3,1)}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hidden{display:none !important}

/* 横向き・iPad横 */
@media (orientation:landscape) and (min-width:640px){
  .stage{max-height:28dvh}
  .panel{padding:24px}
}
@media (min-width:768px) and (orientation:portrait){
  .bubble-text{font-size:16px}
  .panel{padding:26px}
}

/* ===== ボタン ===== */
.btn{min-height:54px;padding:0 22px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.02em;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .15s ease,box-shadow .2s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);
  box-shadow:0 10px 26px rgba(99,102,241,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:var(--glass2);border:1px solid var(--stroke)}
.btn.hintbtn{background:linear-gradient(135deg,rgba(251,191,36,.22),rgba(251,191,36,.08));border:1px solid rgba(251,191,36,.45);color:#fde68a}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.big{min-height:62px;font-size:18px;width:100%}
@media (hover:hover){.btn.primary:hover{box-shadow:0 14px 32px rgba(99,102,241,.6)}}

/* ===== スタート ===== */
.hero{display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.eyebrow{margin:0;font-size:11px;letter-spacing:.22em;color:var(--accent);font-weight:700}
.hero h1{margin:0;font-size:clamp(26px,6.5vw,40px);line-height:1.25;font-weight:900}
.hero h1 span{background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#f5cf73);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0;color:var(--sub);line-height:1.7;font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{padding:8px 12px;border-radius:12px;background:var(--glass2);border:1px solid var(--stroke);font-size:13px;font-weight:700}
.record{font-size:13px;color:var(--sub);padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.08)}
.record b{color:var(--gold)}

/* ===== クイズ ===== */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.cat-chip{padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:800;background:rgba(125,211,252,.16);border:1px solid rgba(125,211,252,.4);color:#bae6fd}
.qnum{font-size:13px;color:var(--sub);font-weight:700}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:var(--sub);
  padding:5px 10px;border-radius:10px;background:rgba(0,0,0,.2)}
.progress{height:7px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#7dd3fc,#a78bfa);
  box-shadow:0 0 12px rgba(167,139,250,.8);transition:width .6s cubic-bezier(.2,.9,.3,1)}
.question{margin:0 0 16px;font-size:clamp(18px,4.6vw,23px);line-height:1.6;font-weight:700;
  font-family:"Avenir Next","Segoe UI","Hiragino Sans",system-ui,sans-serif;-webkit-user-select:text;user-select:text}
.blank{display:inline-block;min-width:4.2em;padding:0 8px;margin:0 2px;border-bottom:3px solid var(--accent);color:var(--accent);text-align:center;transition:color .3s}
.blank.filled{color:var(--ok);border-color:var(--ok)}
.choices{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.choices{grid-template-columns:1fr 1fr}}
.choice{position:relative;min-height:60px;padding:12px 16px 12px 58px;border-radius:16px;text-align:left;
  font-size:17px;font-weight:700;font-family:"Avenir Next","Segoe UI","Hiragino Sans",system-ui,sans-serif;
  background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1.5px solid var(--stroke);
  transition:transform .15s,border-color .25s,background .25s,opacity .3s,box-shadow .25s}
.choice .key{position:absolute;left:12px;top:50%;width:34px;height:34px;margin-top:-17px;border-radius:11px;
  display:grid;place-items:center;font-size:14px;font-weight:900;background:rgba(255,255,255,.1);border:1px solid var(--stroke);color:var(--sub)}
.choice:active{transform:scale(.98)}
@media (hover:hover){.choice:not(:disabled):hover{border-color:rgba(125,211,252,.6);background:rgba(125,211,252,.1)}}
.choice.correct{border-color:var(--ok);background:rgba(52,211,153,.17);box-shadow:0 0 0 3px rgba(52,211,153,.18),0 0 24px rgba(52,211,153,.3)}
.choice.correct .key{background:var(--ok);color:#06281c;border-color:var(--ok)}
.choice.wrong{border-color:var(--ng);background:rgba(251,113,133,.15);animation:shake .45s}
.choice.wrong .key{background:var(--ng);color:#3b0711;border-color:var(--ng)}
.choice.dim{opacity:.42}
.choice:disabled{cursor:default}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}

/* ===== リザルト ===== */
.res-head{display:flex;align-items:center;gap:18px;margin-bottom:16px}
.ring{position:relative;width:118px;height:118px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:900;font-size:28px;line-height:1.05}
.ring .val small{display:block;font-size:12px;color:var(--sub);font-weight:700}
.rank{font-size:13px;color:var(--sub);font-weight:700}
.rank b{display:block;font-size:44px;line-height:1;margin:4px 0;background:linear-gradient(135deg,#fde68a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.stat{padding:12px 8px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);text-align:center}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--sub);font-weight:700}
.sec-title{font-size:14px;font-weight:800;margin:6px 0 10px;color:#c7d2fe;letter-spacing:.04em}
.cat-row{margin-bottom:12px}
.cat-row .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:6px}
.cat-row .top .meta{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.tag{font-size:10.5px;padding:3px 8px;border-radius:99px;font-weight:800}
.tag.weak{background:rgba(251,113,133,.2);color:#fecdd3;border:1px solid rgba(251,113,133,.5)}
.tag.slow{background:rgba(251,191,36,.18);color:#fde68a;border:1px solid rgba(251,191,36,.45)}
.tag.good{background:rgba(52,211,153,.18);color:#a7f3d0;border:1px solid rgba(52,211,153,.45)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.insights{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.insight{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);font-size:13.5px;line-height:1.65}
.insight .ic{font-size:18px;line-height:1.4}
.review details{border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);margin-bottom:8px;overflow:hidden}
.review summary{padding:12px 14px;font-size:14px;font-weight:700;cursor:pointer;list-style:none;line-height:1.5}
.review summary::-webkit-details-marker{display:none}
.review summary::before{content:"▸ ";color:var(--accent)}
.review details[open] summary::before{content:"▾ "}
.review .body{padding:0 14px 14px;font-size:13.5px;line-height:1.7;color:#dbe2ff;white-space:pre-wrap}
.review .ans{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.review .ans span{padding:4px 10px;border-radius:10px;font-size:12.5px;font-weight:700}
.res-actions{display:flex;flex-direction:column;gap:10px;margin-top:18px}
@media (min-width:600px){.res-actions{flex-direction:row}.res-actions .btn{flex:1}}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translate(-50%,-20px);opacity:0;z-index:10;
  padding:10px 18px;border-radius:999px;font-weight:800;font-size:15px;pointer-events:none;transition:all .35s cubic-bezier(.2,1.3,.4,1)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{background:rgba(16,185,129,.92);box-shadow:0 10px 30px rgba(16,185,129,.5)}
.toast.ng{background:rgba(244,63,94,.92);box-shadow:0 10px 30px rgba(244,63,94,.5)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
}

/* ===== ホーム ===== */
.hero{max-width:760px}
.player{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;
  background:linear-gradient(135deg,rgba(96,165,250,.22),rgba(167,139,250,.18));border:1px solid rgba(196,181,253,.35)}
.pl-badge{flex-shrink:0;width:66px;height:66px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#fde68a,#f59e0b);color:#3a2503;box-shadow:0 8px 22px rgba(245,158,11,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.pl-badge span{font-size:11px;font-weight:900;line-height:1}
.pl-badge b{font-size:28px;line-height:1.05;font-weight:900}
.pl-main{flex:1;min-width:0}
.pl-title{font-weight:900;font-size:17px;margin-bottom:8px}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.bar.xp i{background:linear-gradient(90deg,#fde68a,#f59e0b);box-shadow:0 0 10px rgba(251,191,36,.7)}
.pl-xp{font-size:12px;color:var(--sub);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.pl-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pl-stats div{padding:10px 4px;border-radius:14px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08);text-align:center}
.pl-stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.pl-stats span{font-size:11px;color:var(--sub);font-weight:700}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{font-size:14px;padding:0 8px;line-height:1.3}
.x2{display:inline-block;margin-left:4px;padding:2px 7px;border-radius:99px;font-size:11px;background:#f59e0b;color:#3a2503;font-weight:900}
.weakbox{padding:14px;border-radius:18px;background:rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.08)}
.wb-head{font-weight:800;font-size:14.5px;margin-bottom:10px}
.wb-head small{color:var(--sub);font-weight:700;font-size:11.5px;margin-left:6px}
.wcat{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.wcat .info{flex:1;min-width:0}
.wcat .nm{display:flex;justify-content:space-between;gap:6px;font-size:13px;font-weight:700;margin-bottom:5px}
.wcat .nm span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcat .nm span:last-child{color:var(--sub);flex-shrink:0;font-variant-numeric:tabular-nums}
.wcat .btn{min-height:44px;padding:0 12px;font-size:13px;flex-shrink:0}
.wb-dir{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.wb-dir span{font-size:11.5px;padding:5px 9px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--sub);font-weight:700}
.tabs{display:flex;gap:6px;padding:5px;border-radius:16px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.08);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-height:44px;padding:0 14px;border-radius:12px;font-weight:800;font-size:13.5px;color:var(--sub);white-space:nowrap;transition:background .25s,color .25s}
.tab.active{background:linear-gradient(135deg,rgba(96,165,250,.38),rgba(167,139,250,.38));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.setdesc{margin:0;font-size:13px;color:var(--sub);line-height:1.6}
.note{margin:6px 0 0;font-size:11px;color:#8890b5;line-height:1.6}
.units{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.units{grid-template-columns:1fr 1fr}}
.unit{position:relative;display:flex;align-items:center;gap:12px;min-height:74px;padding:12px 14px;border-radius:16px;text-align:left;overflow:hidden;
  background:linear-gradient(145deg,rgba(255,255,255,.1),rgba(255,255,255,.035));border:1.5px solid var(--stroke);transition:transform .15s,border-color .25s}
.unit:active{transform:scale(.98)}
@media (hover:hover){.unit:hover{border-color:rgba(125,211,252,.55)}}
.unit .no{flex-shrink:0;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:15px;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:#c7d2fe}
.unit.cleared .no{background:linear-gradient(135deg,#f5cf73,#f59e0b);color:#3a2503;border-color:transparent}
.unit .tt{flex:1;min-width:0}
.unit .tt b{display:block;font-size:15px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .tt small{font-size:12px;color:var(--sub);font-weight:700}
.unit .st{font-size:18px}
.unit .ubar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#34d399,#7dd3fc)}

/* ===== クイズ ===== */
.lv-chip{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.lv-chip.basic{background:rgba(52,211,153,.15);border:1px solid rgba(52,211,153,.45);color:#a7f3d0}
.lv-chip.adv{background:rgba(251,113,133,.16);border:1px solid rgba(251,113,133,.5);color:#fecdd3}
.lv-chip.voc{background:rgba(125,211,252,.12);border:1px solid rgba(125,211,252,.4);color:#bae6fd}
.mult{padding:5px 9px;border-radius:99px;font-size:11.5px;font-weight:900;background:#f59e0b;color:#3a2503}
.combo{padding:5px 9px;border-radius:99px;font-size:12px;font-weight:900;color:#fff;background:linear-gradient(135deg,#fb7185,#f97316);
  box-shadow:0 0 14px rgba(249,115,22,.6);animation:comboPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes comboPop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.back{width:36px;height:36px;flex-shrink:0;border-radius:11px;background:rgba(255,255,255,.08);border:1px solid var(--stroke);font-weight:900;color:var(--sub)}
.cat-chip{max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qprompt{margin:0 0 6px;font-size:13px;color:var(--sub);font-weight:700}
.qprompt:empty{display:none}
.question.vq{font-size:clamp(28px,8vw,42px);text-align:center;padding:10px 0 6px;letter-spacing:.01em}

.question .pos{display:inline-block;vertical-align:middle;margin-left:8px;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:800;background:rgba(255,255,255,.1);color:var(--sub)}

@keyframes xpUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}20%{opacity:1;transform:translate(-50%,-6px) scale(1.1)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
.empty{padding:14px;border-radius:14px;background:rgba(255,255,255,.04);color:var(--sub);font-size:13px;line-height:1.7;text-align:center}

/* ===== リザルトのXP ===== */

  -webkit-mask:radial-gradient(closest-side,#000,transparent);mask:radial-gradient(closest-side,#000,transparent)}

.lvup p{position:relative;margin:0}
.lvup-label{font-size:16px;font-weight:900;letter-spacing:.3em;color:#fde68a}
.lvup-num{font-size:64px;font-weight:900;line-height:1.1;background:linear-gradient(135deg,#fff7d1,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}

  background:linear-gradient(135deg,rgba(125,211,252,.14),rgba(167,139,250,.12));border:1px solid rgba(125,211,252,.4);
  animation:viewIn .4s cubic-bezier(.2,.9,.3,1)}
.etybox b{display:block;font-size:13px;color:#bae6fd;margin:6px 0 2px;letter-spacing:.04em}

<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<canvas id="snow"></canvas>
<div class="toast" id="toast"></div>

<!-- レベルアップ演出 -->
<div class="lvup" id="lvup" aria-live="assertive">
  <div class="lvup-card">
    <div class="lvup-rays"></div>
    <p class="lvup-label">LEVEL UP!</p>
    <p class="lvup-num">Lv <span id="lvupNum">2</span></p>
    <p class="lvup-title" id="lvupTitle"></p>
    <p class="lvup-tap">タップして閉じる</p>
  </div>
</div>

<div id="app">
  <header class="topbar">
    <div class="brand"><div class="logo">❄</div>Exam English</div>
    <div class="lvpill" id="lvPill">
      <span class="lv">Lv <b id="lvNum">1</b></span>
      <span class="minibar"><i id="lvMini"></i></span>
    </div>
  </header>

  <main class="layout">
    <!-- ナレーション -->
    <section class="stage" id="stage">
      <div class="bubble" id="bubble" role="status" aria-live="polite">

        <div class="bubble-text" id="bubbleText"></div>
      </div>
    </section>

    <!-- パネル -->
    <section class="panel glass" id="panel">
      <!-- ホーム -->
      <div class="view" id="viewStart">
        <div class="hero">
          <!-- プレイヤーカード -->
          <div class="player">
            <div class="pl-badge"><span>Lv</span><b id="plLv">1</b></div>
            <div class="pl-main">
              <div class="pl-title" id="plTitle">英語ビギナー</div>
              <div class="bar xp"><i id="plBar"></i></div>
              <div class="pl-xp" id="plXp">0 / 80 XP</div>
            </div>
          </div>
          <div class="pl-stats">
            <div><b id="stStreak">0</b><span>連続日数</span></div>
            <div><b id="stAns">0</b><span>回答数</span></div>
            <div><b id="stAcc">-</b><span>正答率</span></div>
            <div><b id="stMaster">0</b><span>習得語数</span></div>
          </div>

          <div class="quick">
            <button class="btn primary" id="btnRandom">🎲 ミックス20問</button>
            <button class="btn hintbtn" id="btnWeakList">📕 苦手問題 <span class="x2">XP×2</span></button>
          </div>

          <!-- 苦手分析 -->
          <div class="weakbox">
            <div class="wb-head">🧠 苦手系統の分析 <small>間違いが多い順</small></div>
            <div id="weakCats"></div>
            <div class="wb-dir" id="weakDir"></div>
          </div>

          <div class="tabs" role="tablist" id="tabs">
            <button class="tab active" data-set="gj">文法・中学</button>
            <button class="tab" data-set="gh">文法・高校</button>
            <button class="tab" data-set="v1">単語・標準</button>
            <button class="tab" data-set="v2">単語・発展</button>
            <button class="tab" data-set="id">熟語</button>
          </div>
          <p class="setdesc" id="setDesc"></p>
          <div class="units" id="units"></div>
          <p class="note">※単語・熟語リストは、大学受験の頻出語から独自に選定したものです（市販の単語帳の収録内容・順序とは異なります）。</p>
        </div>
      </div>

      <!-- クイズ -->
      <div class="view hidden" id="viewQuiz">
        <div class="qmeta">
          <button class="back" id="btnQuit" aria-label="ホームへ戻る">✕</button>
          <span class="cat-chip" id="qCat"></span>
          <span class="lv-chip" id="qLv"></span>
          <span class="mult hidden" id="qMult">XP×2</span>
          <span class="combo hidden" id="qCombo"></span>
          <span class="qnum" id="qNum"></span>
          <span class="timer" id="qTimer">⏱ 0.0s</span>
        </div>
        <div class="progress"><i id="progBar"></i></div>
        <p class="qprompt" id="qPrompt"></p>
        <h2 class="question" id="qText"></h2>
        <div class="choices" id="choices"></div>
        <div class="etybox hidden" id="etyBox"></div>
        <div class="actions">
          <button class="btn hintbtn" id="btnHint">💡 ヒントを見る</button>
          <button class="btn primary hidden" id="btnNext">次の問題へ →</button>
        </div>
      </div>

      <!-- リザルト -->
      <div class="view hidden" id="viewResult"></div>
    </section>
  </main>
</div>
<script>
(() => {
'use strict';
const UNITS = [];
function U(id, grade, title, tip, qs){ UNITS.push({ id, grade, title, tip, qs }); }
/* ===== 中学 ===== 各ユニット：0〜6が基礎、7〜9が応用。choices[0] が正解 */
U('j1','中学','be動詞・一般動詞','主語が「三人称単数（he / she / it / 単数の名詞）」かどうかを最初にチェック！ be動詞と一般動詞を混ぜて使わないことも大切だよ。',[
['My sister ___ a high school student.',['is','are','am','be'],'主語の My sister は「三人称単数」だね。','三人称単数の主語に続く be動詞は is。\n訳：私の姉は高校生です。'],
['Tom ___ soccer every Sunday.',['plays','play','playing','is play'],'主語は Tom（三人称単数）、時制は現在。','三人称単数・現在の一般動詞には s をつけるよ（三単現の s）。is play のように be動詞と一般動詞を並べるのは×。\n訳：トムは毎週日曜日にサッカーをする。'],
['___ your brother like music?',['Does','Do','Is','Are'],'like は一般動詞。主語 your brother は三人称単数。','一般動詞の疑問文は Do / Does を文頭に置くよ。主語が三人称単数なので Does。\n訳：あなたのお兄さんは音楽が好きですか。'],
['We ___ in the library now.',['are','is','am','be'],'主語の We は複数だよ。','We / You / They と複数の主語には are。\n訳：私たちは今、図書館にいます。'],
['She ___ have a cat.',['doesn\'t','don\'t','isn\'t','not'],'have は一般動詞。否定文の形は？','三人称単数の一般動詞の否定は doesn\'t＋動詞の原形。has ではなく have になっている点にも注目！\n訳：彼女は猫を飼っていない。'],
['My father ___ to work by train.',['goes','go','going','is go'],'go に三単現の s をつけるとどうなる？','go / do / watch など、o・sh・ch で終わる動詞は es をつけるよ（goes）。\n訳：父は電車で仕事に行く。'],
['They ___ not busy today.',['are','do','does','is'],'busy は形容詞。動詞は一般動詞？ be動詞？','形容詞（busy）が続くときは be動詞。They なので are not。\n訳：彼らは今日は忙しくない。'],
['Each of the students ___ a tablet.',['has','have','having','are have'],'Each of 〜 は「〜のそれぞれ」。数えるのは1人ずつ？','Each of 〜 は「一人ひとり」を指すので単数扱い。have ではなく has になるよ。\n訳：生徒たちはそれぞれタブレットを持っている。'],
['My parents and my sister ___ in Osaka.',['live','lives','is living','does live'],'A and B で主語は何人になる？','A and B が主語のときは複数扱い。だから三単現の s はつけない。\n訳：両親と姉は大阪に住んでいる。'],
['The number of students in my class ___ thirty.',['is','are','have','has'],'主語の中心は students？ それとも number？','The number of 〜 は「〜の数」で、中心は number なので単数扱い。a number of 〜（多くの〜）は複数扱いになるので区別してね。\n訳：私のクラスの生徒数は30人です。']
]);

U('j2','中学','過去形・過去進行形','last 〜 / ago / yesterday など「過去の目印」を探そう。「〜していた（最中）」なら過去進行形 was / were＋ -ing だよ。',[
['I ___ to Kyoto last summer.',['went','go','goes','have gone'],'last summer は過去の一時点。','last 〜 は過去を表す目印。go の過去形は went（不規則変化）。現在完了は last 〜 と一緒に使えないよ。\n訳：私は去年の夏、京都に行った。'],
['She ___ TV when I called her.',['was watching','watched','is watching','watches'],'電話したとき、彼女は「〜している最中」だった。','過去のある時点で進行中だった動作は過去進行形 was / were＋ -ing。\n訳：私が電話したとき、彼女はテレビを見ていた。'],
['___ you see the movie yesterday?',['Did','Do','Were','Have'],'yesterday があり、see は一般動詞。','一般動詞の過去の疑問文は Did＋主語＋原形。\n訳：昨日その映画を見ましたか。'],
['We ___ at home yesterday evening.',['were','was','are','did'],'主語は We、時は yesterday evening。','be動詞の過去形は was / were。We には were を使うよ。\n訳：私たちは昨日の夕方、家にいた。'],
['He didn\'t ___ breakfast this morning.',['eat','ate','eats','eating'],'didn\'t の後ろの動詞の形は？','didn\'t の後ろは必ず動詞の原形。過去の意味は didn\'t が担当しているよ。\n訳：彼は今朝、朝食を食べなかった。'],
['What ___ you doing at eight last night?',['were','did','are','was'],'doing があるので進行形の疑問文だよ。','過去進行形の疑問文は be動詞（were / was）を前に出す。you なので were。\n訳：昨夜8時に何をしていたの？'],
['My mother ___ a cake for me two days ago.',['made','makes','has made','making'],'two days ago は「2日前」。','ago は過去形と一緒に使う目印。現在完了とは一緒に使えないよ。make の過去形は made。\n訳：母が2日前、私にケーキを作ってくれた。'],
['I ___ dinner when the earthquake happened.',['was having','have','am having','have had'],'地震が起きた「その瞬間」、私は何をしている最中だった？','過去の出来事（地震）が起きたときに進行中だった動作は過去進行形。have は「食べる」の意味なら進行形にできるよ。\n訳：地震が起きたとき、私は夕食を食べていた。'],
['While I ___ home, I met an old friend.',['was walking','walk','am walking','have walked'],'While 〜「〜している間に」、時制は met（過去）に合わせる。','while の節には進行形がよく使われるよ。過去の話なので was walking。\n訳：家に歩いて帰る途中、旧友に会った。'],
['When did you ___ him?',['meet','met','meeting','have met'],'did の後ろの形を思い出して。','did があるので動詞は原形 meet。when は「いつ」とピンポイントの時を聞くので現在完了とは一緒に使えないんだ。\n訳：いつ彼に会ったの？']
]);

U('j3','中学','未来表現・助動詞','助動詞の後ろは必ず動詞の原形！ must（〜しなければならない / 〜に違いない）と must not（禁止）、don\'t have to（不要）の違いがよく狙われるよ。',[
['It ___ rain tomorrow.',['will','is','does','was'],'tomorrow は未来。後ろの rain は原形だね。','未来のことは will＋動詞の原形で表せるよ。\n訳：明日は雨が降るだろう。'],
['I\'m ___ to visit my grandmother next week.',['going','go','will','went'],'I\'m 〜 to visit の形を完成させよう。','be going to＋原形で「〜するつもり・予定」。\n訳：来週、祖母を訪ねる予定です。'],
['You ___ run in the hallway. It\'s dangerous.',['must not','must','have to','can'],'「危ない」と言っているね。禁止の表現は？','must not は「〜してはいけない」という強い禁止。\n訳：廊下を走ってはいけません。危ないです。'],
['___ I open the window? — Sure.',['May','Must','Will','Do'],'「窓を開けてもいいですか」と許可を求めているよ。','May I 〜? は「〜してもよいですか」と丁寧に許可を求める表現。\n訳：窓を開けてもいいですか。—どうぞ。'],
['She ___ speak three languages.',['can','cans','can to','is can'],'助動詞には s がつく？ to はいる？','助動詞は主語が三人称単数でも形が変わらず、後ろは原形。can to や is can は×。\n訳：彼女は3か国語を話せる。'],
['You don\'t ___ to come tomorrow. It\'s a holiday.',['have','must','can','should'],'don\'t 〜 to で「〜する必要はない」。','don\'t have to は「〜しなくてよい（不要）」。must not（禁止）とは意味が違うから注意！\n訳：明日は来なくていいよ。休日だから。'],
['___ you help me with this box?',['Could','Must','Shall','May'],'相手に「〜してもらえますか」と丁寧に頼む表現。','Could you 〜? は Can you 〜? より丁寧な依頼。May you や Shall you という言い方はしないよ。\n訳：この箱を運ぶのを手伝っていただけますか。'],
['He will ___ able to swim next year.',['be','can','is','being'],'will と can は並べられる？','助動詞は2つ重ねられないので、will can ではなく will be able to にするよ。\n訳：彼は来年泳げるようになるだろう。'],
['You ___ be tired after the long trip. Take a rest.',['must','mustn\'t','don\'t have to','shall'],'「長旅のあとだから〜に違いない」という推量。','must には「〜に違いない」という強い推量の意味もあるよ。\n訳：長旅のあとだから疲れているに違いない。休んでね。'],
['"Shall we go shopping?" — "___"',['Yes, let\'s.','Yes, we shall.','No, we don\'t.','Yes, please.'],'Shall we 〜?（〜しましょうか）への定番の答え方は？','Shall we 〜? = Let\'s 〜. なので、答えは Yes, let\'s. / No, let\'s not.。Yes, please. は Shall I 〜?（私が〜しましょうか）への答え方だよ。\n訳：買い物に行かない？—うん、行こう。']
]);

U('j4','中学','疑問詞・命令文・感嘆文','答えの部分（By bus. / About fifty. など）から逆算して疑問詞を選ぼう。間接疑問は「疑問詞＋主語＋動詞」の語順だよ。',[
['___ is that tall man? — He is my uncle.',['Who','What','Where','Which'],'答えは「私のおじです」。人について聞いているね。','人が誰かを尋ねるのは Who。\n訳：あの背の高い男性は誰？—私のおじです。'],
['___ do you go to school? — By bus.',['How','What','When','Why'],'答えは「バスで」。手段を聞く疑問詞は？','手段・方法は How。\n訳：どうやって学校に行くの？—バスで。'],
['___ books do you have? — About fifty.',['How many','How much','What','How long'],'books は数えられる名詞。数を聞いているよ。','数えられる名詞の「数」は How many＋複数名詞。量や値段なら How much。\n訳：本を何冊持っているの？—50冊くらい。'],
['___ careful. The road is icy.',['Be','Are','Being','Is'],'careful は形容詞。命令文は動詞の原形で始めるよ。','be動詞の命令文は Be＋形容詞。\n訳：気をつけて。道が凍っているよ。'],
['___ is this bag? — It\'s 3,000 yen.',['How much','How many','What','Which'],'答えは値段だね。','値段を尋ねるのは How much。\n訳：このかばんはいくらですか。—3,000円です。'],
['___ don\'t you join us? — Sure!',['Why','What','How','When'],'「一緒にどう？」と誘う表現。','Why don\'t you 〜? は「〜したらどう？」という提案・誘いの表現。\n訳：一緒に来ない？—もちろん！'],
['___ beautiful flowers these are!',['What','How','Which','So'],'後ろに「形容詞＋名詞（flowers）」が続いているよ。','感嘆文は What＋（a）＋形容詞＋名詞＋S＋V! / How＋形容詞＋S＋V! 名詞があるので What。\n訳：これらはなんて美しい花なんだろう！'],

['My mother made me ___ my room.',['clean','to clean','cleaning','cleaned'],'make＋人＋〜 の形。','使役動詞 make＋O＋原形 で「Oに（無理やり）〜させる」。\n訳：母は私に部屋を掃除させた。'],
['I heard someone ___ my name.',['call','to call','called','calls'],'知覚動詞 hear＋O＋〜。名前を呼んだのは someone。','知覚動詞＋O＋原形（一部始終）／ -ing（途中）。to 不定詞にはならない。\n訳：誰かが私の名前を呼ぶのが聞こえた。'],
['He was made ___ there alone.',['to go','go','going','gone'],'make O do が受動態になると…？','使役 make・知覚動詞の受動態では、原形が to 不定詞に変わる：be made to do。\n訳：彼は1人でそこへ行かされた。'],
['Let me ___ myself.',['introduce','to introduce','introducing','introduced'],'let＋O＋〜 の形。','let＋O＋原形 で「Oに〜させてあげる（許可）」。\n訳：自己紹介させてください。'],
['I couldn\'t make myself ___ in English.',['understood','understand','understanding','to understand'],'自分が（相手に）「理解される」。','make oneself understood で「自分の言うことを分かってもらう」。\n訳：英語で自分の言いたいことを分かってもらえなかった。'],
['The baby is being ___ care of by her aunt.',['taken','take','took','taking'],'take care of の受動態＋進行形。','進行形の受動態は be being p.p.。take care of は群動詞なのでまとめて受動態にする。\n訳：その赤ちゃんはおばに世話をされている。'],
['She got her purse ___ on the train.',['stolen','steal','stealing','to steal'],'財布は「盗まれた」側。','get / have＋O＋過去分詞 は「Oを〜される（被害）」の意味にもなる。\n訳：彼女は電車で財布を盗まれた。'],
['He was seen ___ the building.',['to enter','enter','entered','enters'],'see O do の受動態。','知覚動詞の受動態も be seen to do と to が必要になる。\n訳：彼はその建物に入るところを見られた。'],
['The plan is said ___ by the city last year.',['to have been approved','to be approved','approving','having approved'],'計画は「承認された」側で、時は last year（過去）。','is said（現在）より前のことで、しかも受動 → 完了不定詞の受動態 to have been p.p.。\n訳：その計画は昨年市によって承認されたと言われている。']
]);

U('h10','高校','接続詞・前置詞（応用）','so 〜 that（形容詞・副詞）と such 〜 that（名詞）、despite（前置詞）と although（接続詞）、by（期限）と until（継続）は品詞・意味で区別しよう！',[
['___ he is rich, he is not happy.',['Although','Because','If','Unless'],'「金持ちだ」と「幸せではない」は逆の内容。','Although（Though）S＋V で「〜だけれども」。\n訳：彼は金持ちだが幸せではない。'],
['I\'ll lend you the book ___ you return it by Friday.',['as long as','unless','though','even if'],'「金曜までに返してくれるなら」という条件。','as long as 〜 で「〜しさえすれば・〜する限り」（条件）。\n訳：金曜までに返してくれるなら、本を貸してあげる。'],
['Hurry up, ___ you\'ll miss the bus.',['or','and','but','so'],'急がない「と」バスに乗り遅れる。','命令文, or 〜 で「…しなさい、さもないと〜」。\n訳：急いで、さもないとバスに乗り遅れるよ。'],
['She was ___ tired that she couldn\'t walk.',['so','such','too','very'],'空所の後ろは形容詞 tired だけ。','so＋形容詞・副詞＋that 〜 で「とても…なので〜」。名詞があれば such。\n訳：彼女はとても疲れていたので歩けなかった。'],
['It was ___ a good movie that I saw it twice.',['such','so','too','very'],'後ろに a good movie（名詞のかたまり）。','such (a)＋形容詞＋名詞＋that 〜。so なら so good a movie の語順になる。\n訳：とても良い映画だったので2回見た。'],
['___ the rain, the game was held.',['Despite','Although','Because','Though'],'後ろは the rain（名詞）だけ。','Despite（＝In spite of）は前置詞なので後ろは名詞。Although / Though は接続詞なので S＋V が必要。\n訳：雨にもかかわらず試合は行われた。'],
['I\'ll be back ___ an hour.',['in','after','since','by'],'「今から1時間後に」戻る。','未来について「今から〜後に」は in。\n訳：1時間後に戻ります。'],
['Whether you like it ___ not, you must do it.',['or','and','nor','but'],'whether A 〜 B の形。','whether A or B / whether 〜 or not で「〜であろうとなかろうと」。\n訳：好きであろうとなかろうと、それをやらなければならない。'],
['He works hard ___ that he can buy a house.',['so','such','as','for'],'家を買える「ように」一生懸命働く。','so that S can 〜 で「Sが〜できるように」（目的）。\n訳：彼は家を買えるように一生懸命働いている。'],
['I\'ll finish it ___ Friday.',['by','until','till','since'],'金曜「までに」終える。期限？ 継続？','by は「〜までに（期限）」、until / till は「〜までずっと（継続）」。finish は期限なので by。\n訳：金曜までにそれを終えます。']
]);

U('h11','高校','否定・倒置・強調構文','否定の副詞（Never / Little / Hardly / Not until / Only then）が文頭に出ると「疑問文の語順」に倒置。It is 〜 that の強調構文と部分否定（not all / not always）もセットで！',[
['Never ___ such a beautiful sight.',['have I seen','I have seen','I saw','saw I'],'否定語 Never が文頭に出ているよ。','否定の副詞が文頭に来ると、後ろは疑問文と同じ語順（have I seen）に倒置される。\n訳：こんなに美しい光景は見たことがない。'],
['Hardly ___ home when it began to rain.',['had I left','I had left','did I leave','I left'],'Hardly 〜 when … の構文。時制は？','Hardly (Scarcely) had S p.p. when (before) 〜 で「Sが…するとすぐに〜」。倒置＋過去完了。\n訳：家を出るとすぐに雨が降り出した。'],
['It was Tom ___ broke the window.',['that','what','which','whom'],'It was 〜 that … の強調構文。','It is (was) 強調したい語句 that 〜 の強調構文。人なら who も可だが、whom は主語の位置には使えない。\n訳：窓を割ったのはトムだった。'],
['Not all the students ___ the answer.',['know','knows','is knowing','has known'],'主語は the students（複数）。Not all は部分否定。','Not all 〜 は「全員が〜というわけではない」（部分否定）。主語は複数なので know。\n訳：生徒全員が答えを知っているわけではない。'],
['He is ___ a liar. He always tells the truth.',['anything but','nothing but','all but','but for'],'いつも本当のことを言う人＝うそつきでは「ない」。','anything but 〜「決して〜ではない」。nothing but 〜 は「〜にすぎない」で逆の意味。\n訳：彼は決してうそつきではない。いつも本当のことを言う。'],
['Little ___ that he was in danger.',['did he know','he knew','he did know','knew he'],'否定語 Little が文頭。一般動詞の倒置の形は？','否定語が文頭→倒置。一般動詞の過去なら did＋S＋原形。Little did he know で「まったく知らなかった」。\n訳：彼は自分が危険な状態にあるとは夢にも思わなかった。'],
['I ___ want to go, but I can\'t.',['do','am','have','so'],'want を強めて「本当に行きたい」。','動詞の前に do / does / did を置くと強調になる（強調の do）。\n訳：本当に行きたいんだけど、行けないんだ。'],
['Only then ___ the truth.',['did I realize','I realized','realized I','I did realize'],'Only＋副詞句が文頭に出ているよ。','Only＋副詞（句・節）が文頭に来ても倒置が起こる。\n訳：そのとき初めて私は真実に気づいた。'],
['No sooner had he arrived ___ he fell asleep.',['than','when','as','before'],'No sooner 〜 の相棒は？','No sooner had S p.p. than 〜 で「Sが…するやいなや〜」。比較の than を使うのがポイント（Hardly は when）。\n訳：彼は着くやいなや眠ってしまった。'],
['It is not until you lose your health ___ you realize its value.',['that','when','which','what'],'It is not until A that B の強調構文。','It is not until A that B で「Aして初めてBする」。\n訳：健康を失って初めてそのありがたみがわかる。']
]);

U('h12','高校','名詞・代名詞・冠詞','advice / information / furniture は不可算名詞（a も -s もつかない）。one / another / the other / others の区別、比較対象をそろえる that / those も超頻出！',[
['Please give me some ___.',['advice','advices','an advice','many advice'],'advice は数えられる名詞？','advice は不可算名詞なので a も複数形の -s もつかない。数えるなら a piece of advice。\n訳：アドバイスをください。'],
['I have two pens. One is red, and ___ is blue.',['the other','another','other','others'],'ペンは2本。1本目以外の「残りの1本」は？','2つのうち一方は one、残りの1つは the other（特定されるので the）。\n訳：ペンが2本ある。1本は赤で、もう1本は青だ。'],

['I don\'t like this shirt. Show me ___.',['another','the other','other','others'],'他にも何枚もある中の「別の1枚」。','不特定の「もう1つ別のもの」は another（an＋other）。\n訳：このシャツは気に入らない。別のを見せて。'],
['Each student ___ his or her own locker.',['has','have','having','are having'],'Each＋単数名詞 は単数扱い。','Each / Every＋単数名詞 は単数扱い。\n訳：生徒はそれぞれ自分のロッカーを持っている。'],
['She ___ me of my mother.',['reminds','remembers','recalls','memorizes'],'後ろの「人＋of」の形をとる動詞は？','remind 人 of 〜 で「人に〜を思い出させる」。\n訳：彼女を見ると母を思い出す。'],
['Can I ___ your pen?',['borrow','lend','lent','owe'],'自分が「借りる」のか、相手に「貸す」のか。','borrow は「（無料で）借りる」、lend は「貸す」。\n訳：ペンを借りてもいい？'],
['The climate of Japan is milder than ___ of Canada.',['that','it','one','this'],'比較しているのは「日本の気候」と「カナダの気候」。','同じ名詞（the climate）のくり返しを避ける that（複数なら those）。\n訳：日本の気候はカナダの気候より温暖だ。'],
['I found ___ difficult to answer the question.',['it','that','this','one'],'find O C の O が長いので仮に置く語は？','形式目的語の it：find it 形容詞 to do「〜するのは…だとわかる」。\n訳：その質問に答えるのは難しいと思った。'],
['Some people like summer; ___ prefer winter.',['others','another','the other','other'],'Some people 〜, ___ … で「〜な人もいれば…な人もいる」。','Some 〜, others … で「〜な人もいれば…な人もいる」。the others だと「残り全員」になる。\n訳：夏が好きな人もいれば、冬のほうが好きな人もいる。']

U('h13','高校','語彙・語法（頻出）','意味だけで覚えず「どんな形をとるか」まで覚えよう（remind 人 to do / persuade 人 to do / suggest that）。lie（横たわる）と lay（横たえる）の活用も定番！',[

['Please ___ me to call him tomorrow.',['remind','remember','recall','memorize'],'後ろは「人＋to do」。この形をとれる動詞は？','remind 人 to do で「人に〜するのを思い出させる」。remember / recall / memorize は「人＋to do」をとらない。\n訳：明日彼に電話するよう念を押してください。'],

['He ___ me 1,000 yen for the book.',['charged','cost','paid','spent'],'店が客に「料金を請求する」。','charge 人 金額 for 〜 で「〜の代金として人に…を請求する」。\n訳：彼はその本の代金として私に1,000円請求した。'],
['The accident ___ him his life.',['cost','took','spent','paid'],'事故が彼に「命を犠牲にさせた」。','cost 人 〜 で「人に〜を犠牲にさせる・費やさせる」。\n訳：その事故で彼は命を落とした。'],
['Could you ___ me the way to the station?',['tell','teach','say','speak'],'道を「教える」には？ teach は学問や技術を教えるとき。','道を教えるのは tell（口頭）か show（案内・地図で）。teach は学問・技術を教えるとき。\n訳：駅への道を教えていただけますか。'],
['She ___ her parents to let her study abroad.',['persuaded','suggested','insisted','said'],'後ろが「人＋to do」の形をとれる動詞は？','persuade 人 to do で「人を説得して〜させる」。suggest は人＋to do の形をとれないよ。\n訳：彼女は両親を説得して留学させてもらった。'],
['The number of tourists has ___ dramatically.',['increased','raised','risen up','grown up'],'自動詞「増える」が入る。raise は他動詞だよ。','increase は自動詞で「増える」。raise は他動詞（〜を上げる）、grow up は「成長する」。\n訳：観光客の数が劇的に増えた。'],
['I ___ on the sofa and fell asleep.',['lay','laid','lain','lied'],'「横になった」の過去形。lie と lay の活用に注意！','lie（横たわる）- lay - lain、lay（横たえる）- laid - laid、lie（うそをつく）- lied - lied。\n訳：私はソファに横になって眠ってしまった。'],
['Prices are ___ these days.',['high','expensive','dear','costly'],'主語が「物」ではなく price（値段）だよ。','price（値段）が高い・安いは high / low。expensive / cheap は物そのものに使う。\n訳：最近は物価が高い。']

U('h14','高校','熟語・句動詞','put off（延期）/ call off（中止）/ put up with（我慢）/ come up with（思いつく）など、似た形の熟語は意味の違いをペアで覚えよう！',[

['I ___ a good idea.',['came up with','caught up with','put up with','kept up with'],'アイデアを「思いつく」。','come up with「（考えを）思いつく」。\n訳：いい考えを思いついた。'],
['He finally ___ smoking for his health.',['gave up','gave in','took up','looked up'],'健康のためにタバコを…？','give up「やめる」。take up は「始める」なので「健康のため」と合わない。\n訳：彼は健康のためについにタバコをやめた。'],
['Please ___ this form.',['fill out','fill up','carry out','find out'],'用紙に「記入する」。','fill out (in)「（書類に）記入する」。carry out は「実行する」、find out は「わかる」。\n訳：この用紙に記入してください。'],
['The meeting was ___ because of the rain.',['called off','called on','called for','called up'],'雨で会議が「中止」になった。','call off＝cancel「中止する」。call on「訪問する」、call for「要求する」、call up「電話する」。\n訳：雨のため会議は中止になった。'],
['We ran ___ milk, so I went to the store.',['out of','out','into','over'],'牛乳が「なくなった」。','run out of 〜「〜を使い果たす」。run into は「偶然会う」。\n訳：牛乳が切れたので店に行った。'],

U('h15','高校','共テ頻出語彙・表現','共通テストには文法だけの大問はないけれど、長文・図表・お知らせ文に出る語彙（according to / amount と number / register など）を知っていると読むスピードが一気に上がるよ！',[

['The event was ___ due to bad weather.',['canceled','cancel','canceling','cancels'],'イベントは「中止された」側。due to は「〜のために」。','be canceled due to 〜「〜のため中止された」。due to＝because of。\n訳：悪天候のためイベントは中止された。'],
['This app is ___ for students who want to learn vocabulary.',['designed','design','designing','designs'],'アプリは「作られた・設計された」側。','be designed for 〜「〜向けに作られている」。製品紹介文の頻出表現。\n訳：このアプリは語彙を学びたい学生向けに作られている。'],
['Participants must ___ by March 31.',['register','registration','registered','registering'],'must の後ろは動詞の原形。','register「登録する（動詞）」、registration「登録（名詞）」。品詞の区別も大切。\n訳：参加者は3月31日までに登録しなければならない。'],
['According ___ the survey, 60% of students use smartphones for studying.',['to','with','for','by'],'「調査によると」。','according to 〜「〜によると」。グラフ・調査の問題で必ず出る表現。\n訳：調査によると、学生の60%がスマホを勉強に使っている。'],
['The graph shows that the ___ of plastic waste has doubled.',['amount','number','many','few'],'plastic waste は数えられる？','不可算名詞の「量」は amount、可算名詞の「数」は number。waste は不可算なので amount。\n訳：グラフはプラスチックごみの量が2倍になったことを示している。'],
['The article mainly ___ the benefits of sleep.',['focuses on','focuses','depends on','results in'],'記事が主に「〜に焦点を当てている」。','focus on 〜「〜に焦点を当てる」。「記事の主旨」を問う設問の選択肢によく出る。depend on は「〜次第」、result in は「〜という結果になる」。\n訳：その記事は主に睡眠の利点を取り上げている。'],
['Which of the following is a fact, not an ___?',['opinion','idea','advice','example'],'共テでは「事実」と何を区別させる問題がよく出る？','fact（事実）と opinion（意見）の区別は共通テストの頻出設問。「〜と思う」「〜すべき」「best」などの語は意見のサイン！\n訳：次のうち、意見ではなく事実はどれか。'],
['Many species are in ___ of extinction.',['danger','risk','fear','threat'],'「絶滅の危機にある」の決まった形。','be in danger of 〜「〜の危険がある」。risk なら at risk of。環境問題の長文で頻出。\n訳：多くの種が絶滅の危機にある。']
]);

const VOCAB1 = `

/* ================= 定数 ================= */
const OK_TITLES = ['正解！すごいね ✨','大正解！','やったね、正解！','その調子！正解だよ'];

const BASIC_N = 7;           // 文法ユニットの 0〜6 が基礎、7〜9 が応用
const STAGE_SIZE = 40;       // 単語ステージの語数
const POS_NAME = { '動':'動詞', '名':'名詞', '形':'形容詞', '副':'副詞', '接':'接続詞', '前':'前置詞', '熟':'熟語' };

  v1:{ label:'単語・標準', desc:'高校基礎〜標準レベル（共テで必須の約1400語レベル相当）。1回10問、英→日／日→英がランダム。2回連続正解で「習得」。', base:6 },
  v2:{ label:'単語・発展', desc:'国公立・難関私大レベル（約1900語レベル相当）。抽象語・論説文頻出語を中心に。2回連続正解で「習得」。', base:8 },

const TITLES = [[1,'英語ビギナー'],[5,'単語コレクター'],[10,'文法ハンター'],[15,'長文チャレンジャー'],[20,'共テファイター'],[30,'難関アタッカー'],[40,'英語マスター'],[50,'英語の覇者']];
const needXp = lv => 60 + lv * 20;

/* ================= ユーティリティ ================= */
const $ = id => document.getElementById(id);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtSec = ms => (ms/1000).toFixed(1) + '秒';
const today = () => { const d = new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
const pct = (c, n) => n ? Math.round(c / n * 100) : 0;

/* ================= 問題データの展開 ================= */
const ITEMS = {};            // id → item
const GROUPS = { gj:[], gh:[], v1:[], v2:[], id:[] };   // タブごとのユニット／ステージ

// 文法
UNITS.forEach((u, ui) => {
  const set = u.grade === '中学' ? 'gj' : 'gh';
  const g = { id:u.id, set, kind:'grammar', no:ui+1, title:u.title, tip:u.tip, items:[] };
  u.qs.forEach((q, i) => {
    const it = { id:`${u.id}-${i}`, kind:'grammar', group:g, set, level: i < BASIC_N ? '基礎' : '応用',
      q:q[0], answer:q[1][0], choices:q[1], hint:q[2], exp:q[3], cat:`文法：${u.title}` };
    ITEMS[it.id] = it; g.items.push(it);
  });
  GROUPS[set].push(g);
});

// 単語・熟語
const RAW = { v1:VOCAB1, v2:VOCAB2, id:IDIOMS };
Object.entries(RAW).forEach(([set, text]) => {
  const list = text.trim().split('\n').map((line, i) => {
    const [w, pos, m] = line.split('|');
    const it = { id:`${set}-${i}`, kind:'vocab', set, w, pos, m,
      segs: m.replace(/（[^）]*）/g, '').split('・').map(s => s.trim()).filter(Boolean),
      cat: set === 'id' ? '熟語' : `${SETS[set].label}：${POS_NAME[pos] || pos}` };
    ITEMS[it.id] = it; return it;
  });
  const n = Math.max(1, Math.round(list.length / STAGE_SIZE)), per = Math.ceil(list.length / n);
  for (let s = 0; s < n; s++){
    const items = list.slice(s*per, (s+1)*per);
    const g = { id:`${set}s${s+1}`, set, kind:'vocab', no:s+1, title:`Stage ${s+1}`,
      range:`${items[0].w} 〜 ${items[items.length-1].w}`, items };
    items.forEach(it => it.group = g);
    GROUPS[set].push(g);
  }
  RAW[set] = list;
});
const VOCAB_ALL = [...RAW.v1, ...RAW.v2, ...RAW.id];
const parseKV = t => Object.fromEntries(t.trim().split('\n').map(l => { const i = l.indexOf('='); return [l.slice(0, i), l.slice(i + 1)]; }));
const ETY = parseKV(ETY_W), ETY_ID = parseKV(ETY_I);
function noteOf(it){
  const n = it.set === 'id' ? ETY_ID[it.w] : ETY[it.w];
  if (!n) return '';
  const label = it.set !== 'id' && /[a-z]+\([^)]*\)/i.test(n) ? '🧬 語源' : '💡 覚え方';
  return `${label}\n${n.split(' ／ ').join('\n')}`;
}
const GRAMMAR_ALL = [...GROUPS.gj, ...GROUPS.gh].flatMap(g => g.items);

// 意味が重なる語どうしは同じ問題の選択肢に並べない
const overlap = (a, b) => a.segs.some(x => b.segs.some(y => x === y || (x.length >= 2 && y.length >= 2 && (x.includes(y) || y.includes(x)))));
function buildVocabQuestion(it){
  const dir = Math.random() < .5 ? 'ej' : 'je';
  const pool = RAW[it.set];
  const same = shuffle(pool.filter(o => o !== it && o.pos === it.pos && !overlap(o, it)));
  const others = shuffle(pool.filter(o => o !== it && o.pos !== it.pos && !overlap(o, it)));
  const ds = [];
  for (const o of [...same, ...others]){
    if (ds.length === 3) break;
    if (ds.some(d => overlap(d, o) || d.w === o.w)) continue;
    ds.push(o);
  }
  const opts = shuffle([it, ...ds]).map(o => ({ text: dir === 'ej' ? o.m : o.w, src:o }));
  return { dir, opts, answer: dir === 'ej' ? it.m : it.w };
}

/* ================= ナレーション ================= */
const bubble = $('bubble'), bTitle = $('bubbleTitle'), bText = $('bubbleText');
let typing = null;
function say(text, { tone = '', title = '' } = {}){
  if (typing) typing.finish();
  bubble.className = 'bubble' + (tone ? ' tone-' + tone : '');
  bTitle.textContent = title;
  void bubble.offsetWidth; bubble.classList.add('pop');
  bText.scrollTop = 0;
  const chars = Array.from(text), start = performance.now(), speed = 15;
  const caret = document.createElement('span'); caret.className = 'caret';
  const state = { raf:0, done:false, finish(){ if (state.done) return; state.done = true; cancelAnimationFrame(state.raf); bText.textContent = text; } };
  const step = now => {
    if (state.done) return;
    const n = Math.min(chars.length, Math.floor((now - start) / speed));
    bText.textContent = chars.slice(0, n).join(''); bText.appendChild(caret);
    bText.scrollTop = bText.scrollHeight;
    if (n >= chars.length){ state.finish(); return; }
    state.raf = requestAnimationFrame(step);
  };
  state.raf = requestAnimationFrame(step);
  typing = state;
}
bubble.addEventListener('click', () => typing && typing.finish());
function toast(msg, type){
  const t = $('toast'); t.textContent = msg; t.className = 'toast ' + type;
  void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('show'), 1100);
}

/* ================= 出題 ================= */
let run = null, idx = 0, log = [], qStart = 0, hintUsed = false, answered = false, timerId = 0, current = null, combo = 0;

function prepare(it){
  if (it.kind === 'grammar') return { it, dir:'g', opts: shuffle(it.choices).map(t => ({ text:t })), answer: it.answer };
  return { it, ...buildVocabQuestion(it) };
}
function startRun(items, info){
  if (!items.length) return;
  run = { mult:1, ...info, qs: items.map(prepare), xp:{ base:0, speed:0, combo:0, bonus:0, daily:0 }, xpTotal:0, lvStart:save.lv, ups:0 };
  idx = 0; log = []; combo = 0; mode = 'quiz';
  show('viewQuiz');
  nextQuestion();
}
function startGroup(g){
  if (g.kind === 'grammar'){
    const items = shuffle(g.items.slice(0, BASIC_N)).concat(shuffle(g.items.slice(BASIC_N)));
    return startRun(items, { type:'unit', group:g, label:`Unit ${g.no}　${g.title}` });
  }
  // 単語ステージ：未習得の語を優先して10問
  const sorted = shuffle(g.items).sort((a, b) => (save.vm[a.id] || 0) - (save.vm[b.id] || 0));
  startRun(sorted.slice(0, 10), { type:'stage', group:g, label:`${SETS[g.set].label} ${g.title}`, stageWasCleared: groupCleared(g) });
}
function startRandom(){
  startRun(shuffle([...shuffle(GRAMMAR_ALL).slice(0, 8), ...shuffle(VOCAB_ALL).slice(0, 12)]), { type:'random', label:'全範囲ミックス20問' });
}
function startWeak(){
  const ids = Object.entries(save.weak).sort((a, b) => b[1].w - a[1].w || Math.random() - .5).map(e => e[0]);
  startRun(shuffle(ids.slice(0, 15).map(id => ITEMS[id]).filter(Boolean)), { type:'weak', label:'苦手問題集', mult:2 });
}
function startCategory(cat){
  const all = Object.values(ITEMS).filter(it => it.cat === cat);
  const weakFirst = shuffle(all).sort((a, b) => (save.weak[b.id]?.w || 0) - (save.weak[a.id]?.w || 0) || (save.vm[a.id] || 0) - (save.vm[b.id] || 0));
  startRun(shuffle(weakFirst.slice(0, 10)), { type:'cat', label:`系統特訓：${cat}`, mult:2 });
}

  else if (run.type === 'unit' && idx === BASIC_N) say('ここからは応用問題！（XPもアップ）\n基礎で確認したルールを組み合わせて考えよう。', { title:'' });

  else say(current.dir === 'ej' ? pick(['パッと意味が浮かぶかな？','品詞もヒントになるよ。','似た意味の選択肢に注意！']) : pick(['つづりをイメージしてから選ぼう。','品詞が合っているかもチェック！','似た形の単語に注意！']), { title:'' });

  qStart = performance.now();

function answer(i){
  if (answered) return; answered = true;
  const time = performance.now() - qStart; clearInterval(timerId);
  $('qTimer').textContent = '⏱ ' + (time/1000).toFixed(1) + 's';
  const it = current.it, chosen = current.opts[i], ok = chosen.text === current.answer;
  log.push({ q: current, it, correct: ok, time, hint: hintUsed, chosen: chosen.text });

  // ---- 統計 ----
  save.total++; if (ok) save.correct++;
  const bump = (obj, k) => { const s = obj[k] || (obj[k] = { n:0, c:0 }); s.n++; if (ok) s.c++; };
  bump(save.cat, it.cat);
  bump(save.dir, it.kind === 'grammar' ? it.level : current.dir);
  if (it.kind === 'vocab') save.vm[it.id] = ok && !hintUsed ? (save.vm[it.id] || 0) + 1 : ok ? (save.vm[it.id] || 0) : 0;
  // 苦手問題集：間違えたら登録、ヒントなし2回連続正解で卒業
  let graduated = false;
  if (!ok){ const w = save.weak[it.id] || (save.weak[it.id] = { w:0, s:0 }); w.w++; w.s = 0; }
  else if (save.weak[it.id] && !hintUsed){ save.weak[it.id].s++; if (save.weak[it.id].s >= 2){ delete save.weak[it.id]; graduated = true; } }

  // ---- XP ----
  let gain = 0;
  if (touchDay()){ run.xp.daily += 20; gain += 20; }
  if (ok){
    combo++;
    const base = it.kind === 'grammar' ? (it.level === '基礎' ? 10 : 16) : SETS[it.set].base;
    const b = Math.round(base * (hintUsed ? .5 : 1));
    const sp = time < 5000 && !hintUsed ? Math.ceil(base * .3) : 0;
    const cb = combo >= 3 ? Math.min(combo, 10) : 0;
    run.xp.base += b * run.mult; run.xp.speed += sp * run.mult; run.xp.combo += cb * run.mult;
    gain += (b + sp + cb) * run.mult;
  } else {
    combo = 0; run.xp.base += 1 * run.mult; gain += 1 * run.mult;
  }
  run.xpTotal += gain;
  const ups = addXp(gain); run.ups += ups;
  persist();

  // ---- 表示 ----
  const btns = [...$('choices').children];
  btns.forEach((b, j) => {
    b.disabled = true;
    if (current.opts[j].text === current.answer) b.classList.add('correct');
    else if (j === i) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  if (it.kind === 'grammar'){ const blank = $('blank'); blank.textContent = it.answer; blank.classList.add('filled'); }
  if (it.kind === 'vocab'){
    const box = $('etyBox'), note = noteOf(it);
    let html = `<span class="word">${esc(it.w)}</span>　${esc(it.m)}`;
    if (note){ const [label, ...rest] = note.split('\n'); html += `\n<b>${esc(label)}</b>${esc(rest.join('\n'))}`; }
    if (!ok && chosen.src && chosen.src !== it){
      const n2 = noteOf(chosen.src);
      html += `<span class="sub">あなたが選んだ <b style="display:inline;color:#fecdd3">${esc(chosen.src.w)}</b>＝${esc(chosen.src.m)}${n2 ? '\n' + esc(n2.split('\n').slice(1).join('\n')) : ''}</span>`;
    }
    box.innerHTML = html; box.classList.remove('hidden');
  }
  $('btnHint').classList.add('hidden');
  $('btnNext').classList.remove('hidden');
  renderCombo();
  xpFloat(btns[i], gain);
  if (navigator.vibrate) navigator.vibrate(ok ? 18 : [30, 40, 30]);
  if (ups) setTimeout(showLevelUp, 450);

  const exp = it.kind === 'grammar' ? it.exp : vocabExp(it, chosen, ok);
  const extra = graduated ? '\n\n🎓 苦手問題集から卒業！' : '';
  if (ok){
    toast(combo >= 3 ? `✓ ${combo}連続正解！` : '✓ 正解！', 'ok');
    const lead = hintUsed ? 'ヒントをしっかり活かせたね！\n\n' : time < 5000 ? '⚡ スピードボーナス！\n\n' : '';
    say(lead + exp + extra, { tone:'ok', title: pick(OK_TITLES) + `　+${gain}XP` });
  } else {
    toast('✗ おしい！', 'ng');
    say(`正解は「${current.answer}」。\n` + exp + '\n（苦手問題集に追加されたよ）', { tone:'ng', title: pick(NG_TITLES) });
  }
  setTimeout(() => $('btnNext').scrollIntoView({ behavior:'smooth', block:'nearest' }), 150);
}
function vocabExp(it, chosen, ok){
  let s = `${it.w}［${POS_NAME[it.pos]}］＝ ${it.m}`;
  if (!ok && chosen.src && chosen.src !== it) s += `\n選んだ「${chosen.text}」の単語も、下のカードでセットで覚えちゃおう！`;
  s += '\n（語源・覚え方は下のカードを見てね）';
  if (ok) s += `\n\n習得度：${'★'.repeat(Math.min(2, save.vm[it.id] || 0))}${'☆'.repeat(Math.max(0, 2 - (save.vm[it.id] || 0)))}`;
  return s;
}

$('btnHint').addEventListener('click', () => {
  if (answered || hintUsed) return;
  hintUsed = true;
  $('btnHint').disabled = true; $('btnHint').textContent = '💡 ヒント表示中（XP半分）';
  const it = current.it;
  let h;
  if (it.kind === 'grammar') h = it.hint;
  else if (current.dir === 'ej') h = `品詞は「${POS_NAME[it.pos]}」。意味は「${Array.from(it.m)[0]}…」で始まるよ。`;
  else if (it.set === 'id') h = `最初の単語は「${it.w.split(' ')[0]}」、全部で${it.w.split(' ').length}語の熟語だよ。`;
  else h = `最初の文字は「${it.w[0]}」、${it.w.length}文字の${POS_NAME[it.pos]}だよ。`;
  say(h, { tone:'hint', title:'ヒント 💡' });
});
$('btnNext').addEventListener('click', () => { idx++; if (idx >= run.qs.length) showResult(); else nextQuestion(); });

/* ================= リザルト ================= */
function groupKeyOf(r){
  if (run.type === 'unit') return r.it.level;
  if (run.type === 'stage') return r.q.dir === 'ej' ? '英→日（意味）' : '日→英（つづり）';
  return r.it.cat;
}
function showResult(){
  mode = 'result'; clearInterval(timerId);
  $('progBar').style.width = '100%';
  const total = log.length, correct = log.filter(r => r.correct).length, acc = correct / total, P = Math.round(acc * 100);
  const avg = log.reduce((s, r) => s + r.time, 0) / total, hints = log.filter(r => r.hint).length;
  const rank = P === 100 ? 'S' : P >= 80 ? 'A' : P >= 60 ? 'B' : 'C';
  const g = run.group;

  // グループ集計
  const map = {};
  log.forEach(r => { const k = groupKeyOf(r); const c = map[k] || (map[k] = { key:k, n:0, c:0, t:0 }); c.n++; c.t += r.time; if (r.correct) c.c++; });
  const groups = Object.values(map).map(c => ({ ...c, acc:c.c / c.n, avg:c.t / c.n }));
  const weak = groups.filter(x => x.acc < 1).sort((a, b) => a.acc - b.acc);

  // 記録・ボーナス
  let newClear = false, prevBest = null;
  if (run.type === 'unit'){
    const s = save.units[g.id] || { best:0, plays:0 };
    prevBest = s.plays ? s.best : null;
    newClear = s.best < 8 && correct >= 8;
    s.best = Math.max(s.best, correct); s.plays++; save.units[g.id] = s;
  }
  let bonus = 0;
  if (newClear) bonus += 100;
  if (P === 100 && total >= 10) bonus += 30;
  if (run.type === 'stage' && groupCleared(g) && !run.stageWasCleared) bonus += 60;
  if (bonus){ run.xp.bonus += bonus; run.xpTotal += bonus; run.ups += addXp(bonus); }
  persist();
  if (run.ups) setTimeout(showLevelUp, 600);

  // 分析メモ
  const ins = [];
  if (weak.length) ins.push(['🎯', `今回いちばん間違いが多かったのは「${weak[0].key}」（${weak[0].c}/${weak[0].n}）。${run.type === 'unit' ? (weak[0].key === '基礎' ? g.tip : '応用は基礎ルールの組み合わせ。解説を読み直して「なぜその答えか」を説明できるようにしよう。') : run.type === 'stage' ? (weak[0].key.startsWith('日→英') ? '日→英は「つづりを思い出す力」。単語を見たら声に出して、手でも書いてみよう。' : '英→日が弱いときは、単語を見て0.5秒で意味が言えるまで繰り返そう。') : '下の「系統特訓」で集中的に復習できるよ。'}`]);
  else ins.push(['🏆', '全問正解！ この範囲はもう得点源だね。']);
  const fastWrong = log.filter(r => !r.correct && r.time < 4000).length;
  if (fastWrong >= 2) ins.push(['⚡', `4秒以内に答えて間違えた問題が ${fastWrong} 問。選ぶ前にもう一度だけ見直そう。`]);
  if (hints / total >= .4) ins.push(['💡', `ヒントを ${hints} 回使用（XP半分）。次はヒント1回減らしてXPを稼ごう！`]);
  ins.push(['⏳', `平均回答時間 ${fmtSec(avg)}。${avg < 5000 ? 'スピードボーナス圏内！' : '5秒以内の正解でスピードボーナスがつくよ。'}`]);
  const wc = weakCategories();
  if (wc.length) ins.push(['🧠', `累計で苦手な系統：${wc.slice(0, 3).map(c => `「${c.key}」${pct(c.c, c.n)}%`).join('、')}。特訓モードは経験値2倍！`]);
  ins.push(['📕', `苦手問題集：現在 ${Object.keys(save.weak).length} 問（ヒントなしで2回連続正解すると卒業）。`]);

  // ナレーション
  let speech = { S:`${total}問全問正解！ 文句なしの満点だよ！`, A:`${correct}/${total}問正解！ かなり仕上がってきたね！`, B:`${correct}/${total}問正解！ あと一歩！`, C:`${correct}/${total}問正解。間違えた問題は、全部これから伸びる部分だよ！` }[rank];
  speech += `\n\n獲得 +${run.xpTotal} XP${run.mult > 1 ? '（2倍ボーナス込み）' : ''}`;
  if (run.ups) speech += `\n🎉 レベルアップ！ Lv ${run.lvStart} → Lv ${save.lv}「${titleOf(save.lv)}」`;
  if (newClear) speech += `\n🏅 Unit ${g.no}「${g.title}」クリア！ +100XP`;
  else if (prevBest !== null && correct > prevBest) speech += `\nベスト記録更新！（${prevBest} → ${correct}問）`;
  if (run.type === 'stage') speech += `\n習得語数：${masteredIn(g)} / ${g.items.length}`;
  say(speech, { tone: rank === 'C' ? '' : 'ok', title: `ランク ${rank}！おつかれさま 🎉` });

  // 描画
  const C = 2 * Math.PI * 50;
  const color = a => a >= 1 ? 'linear-gradient(90deg,#34d399,#6ee7b7)' : a >= .5 ? 'linear-gradient(90deg,#fbbf24,#fde68a)' : 'linear-gradient(90deg,#fb7185,#fda4af)';
  const wrongs = log.filter(r => !r.correct);
  const list = g ? GROUPS[g.set] : null, nextG = list ? list[list.indexOf(g) + 1] : null;
  const X = run.xp;
  $('viewResult').innerHTML = `
    <div class="res-head">
      <div class="ring">
        <svg viewBox="0 0 120 120">
          <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
          <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="11"/>
          <circle id="ringArc" cx="60" cy="60" r="50" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C}" style="transition:stroke-dashoffset 1.2s cubic-bezier(.2,.9,.3,1)"/>
        </svg>
        <div class="val"><div>${P}%<small>${correct} / ${total}</small></div></div>
      </div>
      <div class="rank">RANK<b>${rank}</b>${esc(run.label)}${newClear ? '<br>🏅 クリア！' : ''}</div>
    </div>
    <div class="xpbox">
      <div class="big"><b>+${run.xpTotal} XP</b><span>${run.ups ? `🎉 Lv ${run.lvStart} → ${save.lv}` : `Lv ${save.lv}`}${run.mult > 1 ? '　×2適用' : ''}</span></div>
      <div class="bar xp"><i id="resXp"></i></div>
      <ul>
        <li><span>正解</span><span>+${X.base}</span></li>
        <li><span>スピード</span><span>+${X.speed}</span></li>
        <li><span>コンボ</span><span>+${X.combo}</span></li>
        <li><span>ボーナス</span><span>+${X.bonus + X.daily}</span></li>
      </ul>
    </div>
    <div class="stats">
      <div class="stat"><b>${correct}/${total}</b><span>正解数</span></div>
      <div class="stat"><b>${(avg/1000).toFixed(1)}s</b><span>平均回答時間</span></div>
      <div class="stat"><b>${Math.max(...log.reduce((a, r) => { a.cur = r.correct ? a.cur + 1 : 0; a.max.push(a.cur); return a; }, { cur:0, max:[0] }).max)}</b><span>最大コンボ</span></div>
    </div>
    <div class="sec-title">📊 ${run.type === 'unit' ? '基礎・応用別' : run.type === 'stage' ? '出題形式別' : '系統別'}の分析</div>
    ${groups.sort((a, b) => a.acc - b.acc).map(x => `
      <div class="cat-row">
        <div class="top">${esc(x.key)}
          ${x.acc < 1 && x === weak[0] ? '<span class="tag weak">最優先で復習</span>' : x.acc < 1 ? '<span class="tag weak">要復習</span>' : '<span class="tag good">完璧</span>'}
          <span class="meta">${x.c}/${x.n} ・ 平均 ${(x.avg/1000).toFixed(1)}s</span>
        </div>
        <div class="bar"><i data-w="${Math.max(4, x.acc*100)}" style="background:${color(x.acc)}"></i></div>
      </div>`).join('')}
    <div class="sec-title" style="margin-top:18px">🧠 分析メモ</div>
    <div class="insights">${ins.map(([ic, t]) => `<div class="insight"><span class="ic">${ic}</span><span>${esc(t)}</span></div>`).join('')}</div>
    ${wrongs.length ? `
      <div class="sec-title">📖 間違えた問題の復習</div>
      <div class="review">${wrongs.map(r => r.it.kind === 'grammar' ? `
        <details><summary>[${esc(r.it.level)}] ${esc(r.it.q.replace('___','(　　)'))}</summary>
          <div class="body"><div class="ans"><span style="background:rgba(251,113,133,.18);color:#fecdd3">あなた：${esc(r.chosen)}</span><span style="background:rgba(52,211,153,.18);color:#a7f3d0">正解：${esc(r.it.answer)}</span></div>${esc(r.it.exp)}</div>
        </details>` : `
        <details><summary>${esc(r.it.w)} ＝ ${esc(r.it.m)}</summary>
          <div class="body"><div class="ans"><span style="background:rgba(251,113,133,.18);color:#fecdd3">あなた：${esc(r.chosen)}</span></div>${esc(POS_NAME[r.it.pos])}／${esc(SETS[r.it.set].label)} ${r.it.group.title}${noteOf(r.it) ? '\n\n' + esc(noteOf(r.it)) : ''}</div>
        </details>`).join('')}</div>` : ''}
    <div class="res-actions">
      ${wrongs.length ? '<button class="btn hintbtn big" id="btnRetryWrong">🔁 間違えた問題を解き直す（XP×2）</button>' : ''}
      ${run.type === 'stage' && !groupCleared(g) ? '<button class="btn primary big" id="btnAgain">続けて10問 ▶</button>' : ''}
      ${nextG ? `<button class="btn ${run.type === 'stage' && !groupCleared(g) ? 'ghost' : 'primary'} big" id="btnNextG">次へ：${esc(nextG.title)} →</button>` : ''}
      <button class="btn ghost big" id="btnRetry">もう一度 ↻</button>
      <button class="btn ghost big" id="btnHome">ホームへ</button>
    </div>`;
  show('viewResult');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    $('ringArc').style.strokeDashoffset = C * (1 - acc);
    $('resXp').style.width = (save.xp / needXp(save.lv) * 100) + '%';
    document.querySelectorAll('#viewResult .bar i[data-w]').forEach(i => i.style.width = i.dataset.w + '%');
  }));
  const again = () => run.type === 'unit' || run.type === 'stage' ? startGroup(g) : run.type === 'random' ? startRandom() : run.type === 'weak' ? startWeak() : startRun(shuffle(run.qs.map(q => q.it)), { ...run });
  $('btnRetry').addEventListener('click', again);
  $('btnHome').addEventListener('click', goHome);
  if ($('btnAgain')) $('btnAgain').addEventListener('click', () => startGroup(g));
  if ($('btnNextG')) $('btnNextG').addEventListener('click', () => startGroup(nextG));
  if ($('btnRetryWrong')) $('btnRetryWrong').addEventListener('click', () => startRun(shuffle(wrongs.map(r => r.it)), { type:'retry', label:'間違えた問題の解き直し', mult:2 }));
}

/* ================= 雪 ================= */
function initSnow(){
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('snow'), ctx = cv.getContext('2d');
  let W, H, flakes = [], last = performance.now(), running = true;
  const resize = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(70, W * H / 14000));
    flakes = Array.from({ length: n }, () => ({ x: Math.random()*W, y: Math.random()*H, r: .8 + Math.random()*2.4, v: 14 + Math.random()*30, p: Math.random()*6.28, a: .35 + Math.random()*.5 }));
  };
  const loop = now => {
    if (!running) return;
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    ctx.clearRect(0, 0, W, H); ctx.fillStyle = '#fff';
    for (const f of flakes){
      f.y += f.v * dt; f.p += dt * .8; f.x += Math.sin(f.p) * 12 * dt;
      if (f.y > H + 5){ f.y = -5; f.x = Math.random()*W; }
      ctx.globalAlpha = f.a; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 6.283); ctx.fill();
    }
    requestAnimationFrame(loop);
  };
  addEventListener('resize', resize);
  document.addEventListener('visibilitychange', () => { running = !document.hidden; if (running){ last = performance.now(); requestAnimationFrame(loop); } });
  resize(); requestAnimationFrame(loop);
}

initSnow();
goHome();
})();
</script>
</body>
</html>
